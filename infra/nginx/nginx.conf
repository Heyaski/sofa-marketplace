server {
    listen 80;

    # Увеличиваем лимит размера загружаемых файлов (для больших ZIP архивов с множеством 3D моделей)
    # Увеличено до 5GB для загрузки очень больших архивов (3GB+)
    client_max_body_size 5G;

    # Увеличиваем таймауты для загрузки больших файлов (3-5GB архивы могут загружаться очень долго)
    proxy_connect_timeout 1800s;  # 30 минут
    proxy_send_timeout 1800s;     # 30 минут
    proxy_read_timeout 1800s;     # 30 минут
    send_timeout 1800s;           # 30 минут

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        
        # Дополнительные настройки для API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для API (3-5GB архивы могут загружаться очень долго)
        proxy_connect_timeout 1800s;  # 30 минут
        proxy_send_timeout 1800s;     # 30 минут
        proxy_read_timeout 1800s;     # 30 минут
    }

    location / {
        proxy_pass http://127.0.0.1:3000/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Статика и медиа файлы
    location /static/ {
        alias /path/to/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /path/to/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
