server {
    listen 80;

    # Увеличиваем лимит размера загружаемых файлов до 200GB
    # Для загрузки очень больших файлов (3D модели, архивы и т.д.)
    client_max_body_size 200G;

    # Увеличиваем таймауты для загрузки очень больших файлов (200GB файлы могут загружаться часами)
    # Увеличено до 4 часов для надежной загрузки больших файлов
    proxy_connect_timeout 14400s;  # 4 часа
    proxy_send_timeout 14400s;     # 4 часа
    proxy_read_timeout 14400s;    # 4 часа
    send_timeout 14400s;          # 4 часа

    # Увеличиваем буферы для больших файлов
    client_body_buffer_size 128k;
    proxy_buffering off;  # Отключаем буферизацию для больших файлов (streaming)
    proxy_request_buffering off;  # Отключаем буферизацию запросов для больших загрузок

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        
        # Дополнительные настройки для API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для API (200GB файлы могут загружаться часами)
        proxy_connect_timeout 14400s;  
        proxy_send_timeout 14400s;     
        proxy_read_timeout 14400s;     
        
        # Отключаем буферизацию для больших файлов
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Статика и медиа файлы
    location /static/ {
        alias /path/to/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /path/to/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
