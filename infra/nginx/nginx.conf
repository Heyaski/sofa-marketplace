server {
    listen 80;

    # Увеличиваем лимит размера загружаемых файлов (для больших ZIP архивов с множеством 3D моделей)
    # Увеличено до 2GB для загрузки больших архивов
    client_max_body_size 2G;

    # Увеличиваем таймауты для загрузки больших файлов (2GB архивы могут загружаться долго)
    proxy_connect_timeout 600s;  # 10 минут
    proxy_send_timeout 600s;     # 10 минут
    proxy_read_timeout 600s;     # 10 минут
    send_timeout 600s;           # 10 минут

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        
        # Дополнительные настройки для API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для API (2GB архивы могут загружаться долго)
        proxy_connect_timeout 600s;  # 10 минут
        proxy_send_timeout 600s;     # 10 минут
        proxy_read_timeout 600s;     # 10 минут
    }

    location / {
        proxy_pass http://127.0.0.1:3000/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Статика и медиа файлы
    location /static/ {
        alias /path/to/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /path/to/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
